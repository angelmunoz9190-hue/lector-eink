name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar proyecto Capacitor
        run: |
          mkdir www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Lector E-Ink" com.angelmunoz.lectoreink --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lector-eink-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
